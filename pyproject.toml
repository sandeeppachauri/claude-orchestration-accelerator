[project]
name = "claude-orchestration-accelerator"
version = "0.1.0"
description = "Prompt resolution + process registry (prompt/model/fallback config) for the Claude master accelerator stack"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
logging = [
    "claude-sdk-logger-accelerator>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration_accelerator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
