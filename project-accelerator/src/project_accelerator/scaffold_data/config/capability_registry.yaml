# capability_registry.yaml
#
# Whitelist of process_registry.yaml step keys allowed to pass through to
# each backend's model call (see .claude/rules/process-registry.md's
# "capability passthrough" rule). Validated by
# orchestration_accelerator.registry.get_allowed_capabilities() before a
# step's capabilities ever reach claude_agent_sdk / anthropic -- an
# unlisted key raises UnsupportedCapabilityError immediately, instead of a
# TypeError several layers deep inside the SDK.
#
# This file is deliberately NOT environment-specific (unlike .env): the
# same keys must be valid on every environment a given backend runs in,
# so it lives at the same tier as process_registry.yaml, not in .env.
#
# To add a new capability once its backend actually supports it (e.g. a
# claude-agent-sdk/anthropic SDK bump adds a new ClaudeAgentOptions field
# or Messages API param), add its key to the matching backend's `allowed`
# list here -- no accelerator code change required.

agent_sdk:
  # Named fields on claude_agent_sdk.ClaudeAgentOptions that are safe to
  # set per-step from process_registry.yaml. Deliberately NOT the full
  # field list -- fields like cli_path/env/hooks/resume/session_id/
  # can_use_tool are internal/session-management concerns, not per-step
  # model-call tuning, so they stay off this whitelist even though the
  # dataclass technically accepts them.
  allowed:
    - max_turns
    - thinking
    - max_thinking_tokens
    - effort
    - permission_mode
    - fallback_model
    # Native ClaudeAgentOptions.tools passthrough -- the full built-in
    # toolset (Read/Write/Edit/Bash/...) available to the model, distinct
    # from mcp_servers/allowed_tools below (which only ever narrow MCP
    # tool access). `tools: []` forces a tool-free, text-only turn.
    - tools
    - disallowed_tools
    # MCP access scoping (see .claude/rules/mcp-scope.md) -- popped off
    # by call_agent_sdk() and consumed as hooks, never forwarded to
    # ClaudeAgentOptions directly.
    - mcp_servers
    - allowed_tools
    # Guardrail instance names (see .claude/rules/guardrails-registry.md)
    # -- same pop-and-hook handling as mcp_servers/allowed_tools above.
    - guardrails
    # Native ClaudeAgentOptions.skills passthrough -- unlike the three
    # keys above, this one IS a real field and flows straight through.
    - skills

messages_api:
  # Keyword arguments anthropic.Client.messages.create() accepts that are
  # safe to set per-step from process_registry.yaml.
  allowed:
    - temperature
    - top_p
    - max_tokens
    - thinking
    - stop_sequences
    # Translated by call_messages_api() into the beta client's
    # container.skills shape -- see .claude/rules/mcp-scope.md's sibling
    # skills note.
    - skills
    # Prompt caching (Anthropic ephemeral cache_control breakpoints).
    # messages_api-only: the Messages API exposes explicit, controllable
    # cache_control blocks (type + optional ttl); the agent_sdk backend
    # only does automatic, opaque system-prompt caching with no field to
    # set and no TTL control, so this key is deliberately absent from
    # agent_sdk.allowed above. This entry only gates whether a step may
    # set cache_control at all -- the concrete {type, ttl} value is
    # process-specific and supplied per-step in config/process_registry.yaml,
    # not here. See .claude/rules/capability-registry.md.
    - cache_control
