ticketClassification:
  id: ticketClassification_01
  description: ticketClassification description
  steps: [classify, extract, respond]
  classify:
    prompt: classify.yaml
    model: claude-haiku-4-5-20251001
    fallback: [claude-haiku-4-5-20251001]
    max_turns: 1  # capability passthrough -- any extra key here reaches the model call untouched
  extract:
    prompt: extract_v2.yaml
    model: claude-haiku-4-5-20251001
    fallback: [claude-haiku-4-5-20251001]
  respond:
    prompt: classify_soa.yaml
    model: claude-haiku-4-5-20251001
    fallback: [claude-haiku-4-5-20251001]

templatingDemo:
  id: templatingDemo_01
  description: >
    Demonstrates runtime placeholder ({{key}}) substitution in prompt
    YAML. `classify` (see ticketClassification above) is the static-only
    baseline -- no placeholders, `input` is a plain string. `triage`
    below is example 2 (multiple placeholders, static prompt around
    them). `escalate` is example 3 (complex: placeholders in both
    system_prompt and user_prompt, plus every capability-passthrough key
    in one place).
  steps: [triage, escalate]
  triage:
    prompt: ticket_triage.yaml
    model: claude-haiku-4-5-20251001
    fallback: [claude-haiku-4-5-20251001]
    # input must be a dict: {ticket_id, customer_name, customer_tier, body}
  escalate:
    prompt: escalation_decision.yaml
    model: claude-haiku-4-5-20251001
    fallback: [claude-haiku-4-5-20251001]
    # input must be a dict: {ticket_id, customer_name, customer_tier,
    # account_history, sla_minutes_remaining, body}
    #
    # Capability passthrough -- every key below flows untouched into the
    # model call, validated against capability_registry.yaml's per-backend
    # whitelist before the call happens (an unlisted key raises
    # UnsupportedCapabilityError immediately instead of a TypeError deep
    # inside the SDK). This step is exercised with backend="agent_sdk" by
    # sample_usage.py's TicketEscalator, so only agent_sdk-allowed keys are
    # live here -- a messages_api-only key (temperature, top_p, max_tokens)
    # would fail agent_sdk's whitelist, since the two backends' allowed
    # sets are disjoint, not a shared superset.
    max_turns: 3                                   # agent_sdk
    permission_mode: acceptEdits                    # agent_sdk
    # This step's job is "read the dossier, answer JSON" -- it has no
    # legitimate use for any tool. Note: process_registry.yaml's own
    # `allowed_tools` key (above, commented out) is NOT this -- it's
    # popped off by call_agent_sdk() and only ever narrows MCP tool
    # access (see .claude/rules/mcp-scope.md); non-MCP tools always pass
    # through it untouched. `tools` below is the real
    # ClaudeAgentOptions field that controls the full built-in toolset --
    # without it, the model has Read/Write/Edit/Bash/... available and
    # can burn its max_turns budget on tool-call round-trips instead of
    # ever emitting the final JSON text turn, leaving raw_output empty
    # no matter how high max_turns is set. `tools: []` = no tools
    # reachable, forcing a direct text reply every turn.
    tools: []                                       # agent_sdk
    # thinking disabled by default -- extended-thinking turns count
    # against max_turns and can starve the final JSON-text turn, leaving
    # raw_output empty and validate_output's json.loads() failing with
    # "Expecting value: line 1 column 1". Re-enable only with a max_turns
    # bump to cover the extra turn(s):
    # thinking: {type: enabled, budget_tokens: 4096}  # agent_sdk
    # If this step instead ran with backend="messages_api", the live keys
    # would be messages_api-only, e.g.:
    #   temperature: 0.2
    #   top_p: 0.9
    #   max_tokens: 800
    #
    # MCP access scoping -- independent, opt-in mechanism (see
    # .claude/rules/mcp-scope.md). Narrows which already-configured
    # (.mcp.json / global settings) MCP servers/tools this step may
    # reach; never grants a new server. Commented out -- inactive until a
    # project author opts in:
    # mcp_servers: [git]                     # server-level scoping
    # allowed_tools: ["mcp__git__log"]       # finer, tool-level scoping
    #
    # Guardrails -- independent, opt-in mechanism, unrelated to MCP (see
    # .claude/rules/guardrails-registry.md). Names resolve against
    # config/guardrails.yaml. Commented out -- inactive until opted in:
    # guardrails: [redactPII]
    #
    # Skills -- native ClaudeAgentOptions.skills passthrough (see the
    # skills section of .claude/rules/mcp-scope.md). Commented out --
    # inactive until opted in:
    # skills: [dummyDemoSkill]

