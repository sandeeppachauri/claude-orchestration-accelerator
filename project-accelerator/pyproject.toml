[project]
name = "claude-project-accelerator"
version = "0.1.0"
description = "Master accelerator: execute(payload) entry point + cpa scaffold CLI, composing auth, logging, prompt resolution, and model routing"
requires-python = ">=3.10"
dependencies = [
    "claude-orchestration-accelerator @ git+https://github.com/sandeeppachauri/claude-orchestration-accelerator.git",
    "claude-model-router-accelerator @ git+https://github.com/sandeeppachauri/claude-orchestration-accelerator.git#subdirectory=model-router",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cpa = "project_accelerator.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_accelerator"]
artifacts = ["src/project_accelerator/scaffold_data/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/project_accelerator/scaffold_data" = "project_accelerator/scaffold_data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
