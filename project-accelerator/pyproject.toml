[project]
name = "claude-project-accelerator"
version = "0.1.0"
description = "Master accelerator: execute(payload) entry point + cpa scaffold CLI, composing auth, logging, prompt resolution, and model routing"
requires-python = ">=3.10"
dependencies = [
    "claude-orchestration-accelerator>=0.1.0",
    "claude-model-router-accelerator>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cpa = "project_accelerator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_accelerator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
