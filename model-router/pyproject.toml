[project]
name = "claude-model-router-accelerator"
version = "0.1.0"
description = "Ordered model/fallback execution against a pluggable Claude Agent SDK / Messages API backend"
requires-python = ">=3.10"
dependencies = [
    "claude-orchestration-accelerator>=0.1.0",
]

[project.optional-dependencies]
agent_sdk = [
    "claude-agent-sdk>=0.1.0",
]
messages_api = [
    "anthropic>=0.40.0",
    "claude-auth-accelerator>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router_accelerator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
